name: Secret Scan

# Ported from Suburban_SOC. Fail the build if a credential is committed. Runs
# on every PR and push to main; rules extend the gitleaks defaults via
# .gitleaks.toml at the repo root.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for a complete scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Free for user-owned repos. If this repo is ever transferred to an
        # organization, gitleaks-action requires a GITLEAKS_LICENSE secret and
        # this step fails closed until one is provisioned.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

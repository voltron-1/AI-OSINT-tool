# Keeps the SHA-pinned actions and pinned Python tooling current. Without an
# update channel, SHA pins turn into permanently frozen, eventually vulnerable
# dependencies. Labels match the repo's existing label set.
#
# No pip ecosystem yet, deliberately: declared before a Python manifest exists,
# Dependabot aborts the whole run ("Repo must contain a requirements.txt,
# setup.py, setup.cfg, pyproject.toml, or a Pipfile"), which is a failed job
# every week for no benefit. Plan step 0.6 (#7) creates pyproject.toml and
# re-enables it:
#
#   - package-ecosystem: pip
#     directory: /
#     schedule:
#       interval: weekly
#     labels: [dependencies, python]
version: 2
updates:
  # Covers docker-compose.yml. The db image is pinned to a digest so an AGE
  # rebuild cannot silently change the Postgres major underneath the stack
  # (it already did once: `latest` moved to PG18 and relocated PGDATA). A pin
  # without an update channel is just a frozen, eventually-vulnerable image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # github/codeql-action/init and .../analyze are separate dependencies to
      # Dependabot but one action at runtime: init writes a config that analyze
      # reads, and a version skew fails the job outright ("Loaded a
      # configuration file for version X, but running version Y"). Ungrouped,
      # Dependabot opens one PR per path and each is unmergeable on its own.
      # Group them so both SHAs move in a single commit.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else travels together too: fewer PRs, and a shared runtime
      # bump (e.g. the Node 20 → 24 migration) lands atomically rather than
      # leaving the workflow set half-migrated.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
